<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vibemotion — настройка эффектов</title>
<style>
:root{--bg:#f4f5f8;--sf:#fff;--s2:#eceef4;--bd:#d9dce6;--tx:#171a24;--mu:#6b7186;--ac:#6a4cff;--ok:#1a9f6b;--wn:#c77a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--sf:#181b25;--s2:#222633;--bd:#2c3142;--tx:#e9ebf3;--mu:#8b92a8;--ac:#8d78ff;--ok:#3ccf91;--wn:#f0a93a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--sf:#181b25;--s2:#222633;--bd:#2c3142;--tx:#e9ebf3;--mu:#8b92a8;--ac:#8d78ff;--ok:#3ccf91;--wn:#f0a93a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:15px;margin:0 auto 0 0}button,select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pr{background:var(--ac);border-color:var(--ac);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px 16px;max-width:1100px;margin:auto}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}.ch b{flex:1}.ch small{color:var(--mu)}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--s2);color:var(--mu)}.tag.u{color:var(--wn)}
.ib{padding:2px 8px;line-height:1.3}.off .cb{opacity:.45}
.cb{padding:2px 12px 12px;border-top:1px solid var(--bd)}
.pr2{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px dashed var(--bd)}.pr2:last-child{border:0}
.pr2.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 10%,transparent),transparent)}
.pn{display:flex;align-items:center;gap:6px}.pn span{color:var(--mu);font-size:12px}
.kd{width:22px;height:22px;padding:0;border-radius:5px;transform:rotate(45deg) scale(.7);background:transparent;border:2px solid var(--mu)}.kd.on{background:var(--ac);border-color:var(--ac)}.kd.has{border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);grid-column:1}input[type=number]{width:78px;font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:3px 6px}
.sw{position:relative;width:38px;height:22px;background:var(--s2);border:1px solid var(--bd);border-radius:99px;cursor:pointer}.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mu);transition:.15s}.sw.on{background:var(--ac)}.sw.on i{left:18px;background:#fff}
aside{position:sticky;top:64px;align-self:start}aside .card{padding:12px}aside h3{margin:0 0 8px;font-size:13px}
svg{width:100%;height:auto;display:block;touch-action:none}.gr{stroke:var(--bd)}.cv{stroke:var(--ac);fill:none;stroke-width:2}.hd{fill:var(--ac);cursor:grab}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.mu{color:var(--mu);font-size:12px}
#tl{width:100%}.menu{display:none;padding:6px}.menu.show{display:block}.menu button{display:block;width:100%;text-align:left;margin:3px 0}
</style></head><body>
<header><h1>🎛 Настройка эффектов</h1>
<select id="lay"></select><button id="open">Открыть XML</button><button id="cp" class="pr">Копировать XML</button>
<input id="file" type="file" accept=".xml,text/xml" hidden></header>
<main><section>
<div class="card" style="padding:10px 12px"><div class="pn"><b>Время</b><span id="tv">0.00</span></div>
<input id="tl" type="range" min="0" max="1" step="0.005" value="0"><div class="mu">Время слоя 0…1, как в kf t. Изменение значения при ключах ставит ключ в этой точке.</div></div>
<div id="stack"></div>
<button id="add" class="pr">＋ Добавить эффект</button><div id="menu" class="card menu"></div>
</section>
<aside><div class="card"><h3 id="ct">Кривая параметра</h3><svg id="cs" viewBox="0 0 220 200"></svg><div id="cb" class="row"></div></div>
<div class="card"><h3>Экспорт</h3><div class="mu" id="st">Выберите параметр, чтобы увидеть его график.</div></div></aside></main>
<script>
const C={
gaussianblur:{l:'Размытие по Гауссу',c:'Размытие',p:[['strength','Сила','f',0,.5,.001,0]]},
motionblur4:{l:'Размытие движения',c:'Размытие',p:[['tune','Тонкая настройка','f',0,2,.01,1],['usePos','Учитывать позицию','b',0,1,1,1],['useScale','Учитывать масштаб','b',0,1,1,1],['useAngle','Учитывать поворот','b',0,1,1,1]]},
rgbsep:{l:'RGB-разделение',c:'Цвет',p:[['strength','Сила','f',0,.5,.001,0],['angle','Угол','f',-360,360,.1,0],['centerChannel','Центральный канал','i',0,2,1,1],['mode','Режим','i',0,3,1,2]]},
tile:{l:'Плитка',c:'Стилизация',p:[['scale','Масштаб','f',.1,4,.01,1],['phase','Фаза','f',0,1,.01,0],['angle','Угол','f',-360,360,.1,0],['mirror','Зеркало','b',0,1,1,1],['vertoffs','Вертикальный сдвиг','b',0,1,1,0]]},
oscillate3:{l:'Колебание',c:'Движение',p:[['direction','Направление','i',0,5,1,0],['type','Тип волны','i',0,5,1,0],['angle','Угол','f',-360,360,.1,0],['freq','Частота','f',0,20,.01,5],['mag','Амплитуда','f',0,200,.1,20],['phase','Фаза','f',0,1,.01,0]]},
fractalwarp4:{l:'Фрактальная деформация',c:'Искажение',p:[['mag','Сила','f',0,.3,.001,.05],['scale','Масштаб','f',.1,4,.01,1],['intensity','Интенсивность','f',0,2,.01,.75],['octaves','Октавы','f',1,10,1,6],['screenSpace','В экранных координатах','b',0,1,1,0]]},
glow:{u:1,l:'Свечение',c:'Свет',p:[['radius','Радиус','f',0,1,.001,.1],['strength','Сила','f',0,2,.01,1]]},
dropshadow:{u:1,l:'Тень',c:'Свет',p:[['distance','Смещение','f',0,1,.001,.05],['angle','Угол','f',-360,360,.1,45],['blur','Размытие','f',0,1,.001,.05],['opacity','Непрозрачность','f',0,1,.01,.5]]},
vignette:{u:1,l:'Виньетка',c:'Свет',p:[['size','Размер','f',0,2,.01,.8],['softness','Мягкость','f',0,1,.01,.5]]}};
const PRE={'Линейно':null,'Плавно':[.42,0,.58,1],'Вход':[.55,0,1,.45],'Выход':[0,.55,.45,1],'Резко':[.85,0,1,.9]};
let fx=__DATA__.map(e=>({...e,on:1,open:1})),layers=[],t=0,sel=null;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bez(a,b,c,d,u){const X=s=>3*(1-s)**2*s*a+3*(1-s)*s*s*c+s**3,Y=s=>3*(1-s)**2*s*b+3*(1-s)*s*s*d+s**3;let lo=0,hi=1;for(let i=0;i<40;i++){const m=(lo+hi)/2;X(m)<u?lo=m:hi=m}return Y((lo+hi)/2)}
const ez=e=>{if(!e)return null;const p=e.split(/\s+/);return p[0]=='cubicBezier'&&p.length==5?p.slice(1).map(Number):null};
function ev(p,x){const k=p.k;if(!k||!k.length)return p.v;if(x<=k[0][0])return k[0][1];const L=k[k.length-1];if(x>=L[0])return L[1];
const i=k.findIndex((a,j)=>j<k.length-1&&x>=a[0]&&x<k[j+1][0]),a=k[i],b=k[i+1],u=(x-a[0])/(b[0]-a[0]),e=ez(a[2]),w=e?bez(...e,u):u;return p.t=='float'?a[1]+(b[1]-a[1])*w:a[1]}
const def=(e,p)=>{const d=C[e.id]?.p.find(q=>q[0]==p.n);if(d)return d;const v=p.v??p.k?.[0][1]??0;return[p.n,p.n,p.t=='bool'?'b':p.t=='int'?'i':'f',Math.min(0,v*2),Math.max(1,v*2),.01,v]};
function setVal(p,v){const ty=p.t=='bool'?v:v;if(p.k&&p.k.length){const h=p.k.find(a=>Math.abs(a[0]-t)<.006);h?h[1]=v:(p.k.push([t,v]),p.k.sort((a,b)=>a[0]-b[0]))}else p.v=v}
function diamond(p){const cur=ev(p,t);if(!p.k||!p.k.length){p.k=[[t,cur]];delete p.v}else{const i=p.k.findIndex(a=>Math.abs(a[0]-t)<.006);if(i>=0){p.k.splice(i,1);if(!p.k.length){p.v=cur;delete p.k}}else{p.k.push([t,cur]);p.k.sort((a,b)=>a[0]-b[0])}}}
function row(e,fi,p,pi){const d=def(e,p),v=ev(p,t),has=p.k&&p.k.length,on=has&&p.k.some(a=>Math.abs(a[0]-t)<.006),ty=d[2];
let ctl;if(ty=='b')ctl=`<div class="sw ${v?'on':''}" data-a="bool"><i></i></div>`;else ctl=`<input type="number" value="${(+v).toFixed(ty=='i'?0:3)}" step="${d[5]}" data-a="num">`;
return `<div class="pr2 ${sel&&sel[0]==fi&&sel[1]==pi?'sel':''}" data-f="${fi}" data-p="${pi}"><div class="pn"><button class="kd ${on?'on':has?'has':''}" data-a="kf" title="Ключевой кадр"></button><b>${esc(d[1])}</b>${has?`<span>${p.k.length} ключ.</span>`:''}</div>${ctl}${ty=='b'?'':`<input type="range" min="${d[3]}" max="${d[4]}" step="${d[5]}" value="${v}" data-a="rng">`}</div>`}
function render(){$('stack').innerHTML=fx.map((e,fi)=>{const c=C[e.id];return `<div class="card ${e.on?'':'off'}" data-f="${fi}"><div class="ch" data-a="tog"><b>${esc(c?c.l:e.id)}</b>${c?.u?'<span class="tag u" title="id и параметры по догадке — сверьте с реальным проектом">id не проверен</span>':''}<span class="tag">${esc(c?.c||'другое')}</span>
<button class="ib" data-a="up">↑</button><button class="ib" data-a="dn">↓</button><button class="ib" data-a="pw">${e.on?'●':'○'}</button><button class="ib" data-a="del">✕</button></div>${e.open?`<div class="cb">${e.p.map((p,pi)=>row(e,fi,p,pi)).join('')}</div>`:''}</div>`}).join('')||'<p class="mu">Стек пуст.</p>';curve()}
function curve(){const s=$('cs'),b=$('cb');if(!sel||!fx[sel[0]]?.p[sel[1]]){s.innerHTML='';b.innerHTML='';$('ct').textContent='Кривая параметра';return}
const e=fx[sel[0]],p=e.p[sel[1]],d=def(e,p);$('ct').textContent='Кривая: '+d[1];const W=200,H=150,mn=d[3],mx=d[4],Y=v=>H-(v-mn)/(mx-mn||1)*H+5,X=x=>x*W+10;
let g='';for(let i=0;i<=4;i++)g+=`<line class="gr" x1="10" x2="210" y1="${5+i*H/4}" y2="${5+i*H/4}"/>`;
let pts='';for(let i=0;i<=100;i++)pts+=(i?'L':'M')+X(i/100).toFixed(1)+' '+Y(ev(p,i/100)).toFixed(1);
g+=`<path class="cv" d="${pts}"/>`;(p.k||[]).forEach(a=>g+=`<rect x="${X(a[0])-4}" y="${Y(a[1])-4}" width="8" height="8" fill="var(--ac)" transform="rotate(45 ${X(a[0])} ${Y(a[1])})"/>`);
g+=`<line x1="${X(t)}" x2="${X(t)}" y1="5" y2="${H+5}" stroke="var(--ok)" stroke-width="1.5"/>`;s.innerHTML=g;
const k=p.k||[],i=k.findIndex((a,j)=>j<k.length-1&&t>=a[0]&&t<k[j+1][0]);
if(i<0){b.innerHTML='<span class="mu">Поставьте два ключа и встаньте между ними — появится редактор плавности.</span>';return}
b.innerHTML=Object.keys(PRE).map(n=>`<button data-pre="${n}">${n}</button>`).join('')+'<svg id="be" viewBox="0 0 120 120" style="width:160px;margin-top:6px"></svg>';bez_ui(k[i])}
function bez_ui(kf){const s=$('be'),c=ez(kf[2])||[0,0,1,1],S=100,o=10,px=(x)=>o+x*S,py=y=>o+S-y*S;
const draw=()=>{s.innerHTML=`<rect x="${o}" y="${o}" width="${S}" height="${S}" fill="none" class="gr"/><path class="cv" d="M${px(0)} ${py(0)}C${px(c[0])} ${py(c[1])} ${px(c[2])} ${py(c[3])} ${px(1)} ${py(1)}"/><line class="gr" x1="${px(0)}" y1="${py(0)}" x2="${px(c[0])}" y2="${py(c[1])}"/><line class="gr" x1="${px(1)}" y1="${py(1)}" x2="${px(c[2])}" y2="${py(c[3])}"/><circle class="hd" data-h="0" cx="${px(c[0])}" cy="${py(c[1])}" r="6"/><circle class="hd" data-h="1" cx="${px(c[2])}" cy="${py(c[3])}" r="6"/>`};draw();
s.onpointerdown=ev0=>{const h=ev0.target.dataset.h;if(h==null)return;s.setPointerCapture(ev0.pointerId);s.onpointermove=m=>{const r=s.getBoundingClientRect(),x=(m.clientX-r.left)/r.width*120,y=(m.clientY-r.top)/r.height*120;c[h*2]=Math.min(1,Math.max(0,(x-o)/S));c[h*2+1]=Math.min(1.5,Math.max(-.5,1-(y-o)/S));kf[2]='cubicBezier '+c.map(n=>n.toFixed(4)).join(' ');draw()};s.onpointerup=()=>{s.onpointermove=null;render()}}}
$('stack').addEventListener('click',ev=>{const a=ev.target.closest('[data-a]');if(!a)return;const cd=a.closest('.card'),fi=+cd.dataset.f,pr=a.closest('.pr2'),act=a.dataset.a;
if(pr){const pi=+pr.dataset.p,p=fx[fi].p[pi];sel=[fi,pi];if(act=='kf')diamond(p);if(act=='bool'){setVal(p,ev(p,t)?0:1)}render();return}
if(act=='del')fx.splice(fi,1);else if(act=='up'&&fi>0)[fx[fi-1],fx[fi]]=[fx[fi],fx[fi-1]];else if(act=='dn'&&fi<fx.length-1)[fx[fi+1],fx[fi]]=[fx[fi],fx[fi+1]];else if(act=='pw')fx[fi].on^=1;else if(act=='tog')fx[fi].open^=1;sel=null;render()});
$('stack').addEventListener('input',ev=>{const a=ev.target.dataset.a,pr=ev.target.closest('.pr2');if(!pr||(a!='rng'&&a!='num'))return;const fi=+pr.dataset.f,pi=+pr.dataset.p,p=fx[fi].p[pi];sel=[fi,pi];setVal(p,+ev.target.value);
const o=pr.querySelector(a=='rng'?'input[type=number]':'input[type=range]');if(o)o.value=ev.target.value;curve()});
$('cb').addEventListener('click',ev=>{const n=ev.target.dataset.pre;if(n==null||!sel)return;const p=fx[sel[0]].p[sel[1]],k=p.k,i=k.findIndex((a,j)=>j<k.length-1&&t>=a[0]&&t<k[j+1][0]);if(i<0)return;const q=PRE[n];q?k[i][2]='cubicBezier '+q.join(' '):k[i].splice(2,1);render()});
$('tl').oninput=e=>{t=+e.target.value;$('tv').textContent=t.toFixed(2);render()};
$('add').onclick=()=>{const m=$('menu');m.classList.toggle('show');m.innerHTML=Object.entries(C).map(([id,c])=>`<button data-id="${id}">${c.l} <span class="tag ${c.u?'u':''}">${c.u?'id не проверен':c.c}</span></button>`).join('')};
$('menu').onclick=ev=>{const id=ev.target.closest('button')?.dataset.id;if(!id)return;fx.push({id,on:1,open:1,p:C[id].p.map(q=>({n:q[0],t:q[2]=='b'?'bool':q[2]=='i'?'int':'float',v:q[6]}))});$('menu').classList.remove('show');render()};
const fmt=p=>p.k&&p.k.length?`<property name="${p.n}" type="${p.t}">`+p.k.map(a=>`<kf t="${a[0].toFixed(6)}" v="${(+a[1]).toFixed(6)}"${a[2]?` e="${a[2]}"`:''}/>`).join('')+'</property>':`<property name="${p.n}" type="${p.t}" value="${p.t=='bool'?!!p.v:(+p.v).toFixed(6)}"/>`;
$('cp').onclick=async()=>{const x=fx.filter(e=>e.on).map(e=>`<effect id="com.alightcreative.effects.${e.id}" locallyApplied="true">\n  ${e.p.map(fmt).join('\n  ')}\n</effect>`).join('\n');try{await navigator.clipboard.writeText(x);$('st').textContent='XML эффектов скопирован ('+fx.filter(e=>e.on).length+' шт.).'}catch(_){$('st').textContent='Не удалось скопировать: браузер запретил доступ к буферу.'}};
$('open').onclick=()=>$('file').click();
$('file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const d=new DOMParser().parseFromString(await f.text(),'text/xml');layers=[...d.querySelectorAll('shape')].map((s,i)=>({n:(s.getAttribute('label')||'Слой')+' #'+s.getAttribute('id'),fx:[...s.children].filter(c=>c.tagName=='effect').map(e=>({id:e.getAttribute('id').split('.').pop(),on:1,open:1,p:[...e.children].filter(c=>c.tagName=='property').map(p=>{const o={n:p.getAttribute('name'),t:p.getAttribute('type')};const v=p.getAttribute('value');if(v!=null)o.v=o.t=='bool'?(v=='true'?1:0):+v;const k=[...p.children].filter(c=>c.tagName=='kf').map(c=>[+c.getAttribute('t'),+c.getAttribute('v'),c.getAttribute('e')].filter(x=>x!=null));if(k.length)o.k=k.sort((a,b)=>a[0]-b[0]);return o})}))}));
$('lay').innerHTML=layers.map((l,i)=>`<option value="${i}">${esc(l.n)} (${l.fx.length})</option>`).join('');if(layers.length){fx=layers[0].fx;sel=null;render()}};
$('lay').onchange=e=>{fx=layers[+e.target.value].fx;sel=null;render()};
$('lay').innerHTML='<option>Пример: слой shake</option>';render();
</script></body></html>
